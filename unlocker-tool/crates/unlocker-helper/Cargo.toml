[package]
name = "unlocker-helper"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "unlocker-helper"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unlocker-core = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.7"

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1.4"

# No windivert dependency here on purpose: linking it makes WinDivert.dll a
# hard import, and a missing or AV-quarantined DLL would stop the helper from
# starting at all. UDP/53 aimed at a hardcoded resolver
# (crosspoint-reader#3775) is intercepted by the `unlocker-divert` sidecar
# instead, which the installer ships next to this exe along with
# WinDivert.dll + WinDivert64.sys. See ops/windows_dns.rs.

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
